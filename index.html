<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="DARTS LEGACY"><meta name="theme-color" content="#0b1520">
<title>DARTS LEGACY 修正版</title>
<style>
*{box-sizing:border-box}html{overflow-anchor:none}body{overflow-anchor:none;margin:0;background:#0b1520;color:#edf3f7;font-family:system-ui,sans-serif}header{text-align:center;padding:15px;border-bottom:1px solid #385063}h1{margin:0;color:#f2c66b;font-size:24px}main{max-width:900px;margin:auto;padding:12px}.panel{background:#172839;border:1px solid #385063;border-radius:13px;padding:13px;margin-bottom:12px}.settings{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:13px;color:#c5d1db}select,button{display:block;width:100%;padding:12px;margin-top:4px;background:#0c1b2b;color:white;border:1px solid #567083;border-radius:8px;font-size:16px}button{background:#28556a;font-weight:bold;cursor:pointer}button.primary{background:#e6b95e;color:#152130;border:0}.layout{display:grid;grid-template-columns:1fr 1fr;gap:12px}canvas{display:block;width:100%;max-width:520px;aspect-ratio:1;touch-action:manipulation;cursor:crosshair}.scoregrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.score{padding:12px;background:#0c1b2b;border-radius:10px}.score strong{font-size:32px}.active{outline:2px solid #e6b95e}.muted{color:#aebfcd;font-size:13px}.log{height:180px;overflow:auto;overflow-anchor:none;font-size:13px;line-height:1.7}.crgrid{display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;gap:4px;margin-top:10px}.crgrid div{padding:4px;border-bottom:1px solid #334b60}#message{min-height:24px}#hint{min-height:42px}#crgrid{min-height:0}#message{color:#f2c66b;font-weight:bold;margin-bottom:8px}button:disabled{opacity:.4}@media(max-width:700px){.layout{grid-template-columns:1fr}} 
</style></head><body><header><h1>DARTS LEGACY</h1><div class="muted">501 / STANDARD CRICKET</div></header><main>
<section class="panel"><div class="settings">
<label>ゲーム<select id="mode"><option value="01">501 オープンアウト</option><option value="cr">クリケット</option></select></label>
<label>先攻<select id="first"><option value="0">自分</option><option value="1">NPC</option></select></label>
<label>自分のレーティング<select id="me"></select></label>
<label>NPCのレーティング<select id="cpu"></select></label>
<label>試合形式<select id="legs"><option value="1">1レグ先取</option><option value="2">2レグ先取</option><option value="3" selected>3レグ先取</option><option value="5">5レグ先取</option></select></label>
<div style="display:flex;align-items:end"><button class="primary" id="start">試合開始 / 設定で再開</button></div>
</div></section>
<div class="layout"><section class="panel"><div id="message">レーティングを選んで試合開始</div><canvas id="board" width="600" height="600"></canvas><div class="muted">盤面をタップして狙いを指定。黄色＝狙い、白＝着弾。</div></section>
<section><div class="panel"><div class="scoregrid"><div class="score" id="p0"><div>YOU <span id="r0"></span></div><strong id="s0">501</strong><div class="muted" id="w0"></div></div><div class="score" id="p1"><div>NPC <span id="r1"></span></div><strong id="s1">501</strong><div class="muted" id="w1"></div></div></div><div id="crgrid" class="crgrid" style="display:none"></div><button id="suggest">おすすめ位置を表示</button><button id="npc">NPCを1投進める</button><div id="hint" class="muted" style="margin-top:10px"></div></div><div class="panel"><b>投球履歴</b><div id="log" class="log"></div></div></section></div>
</main><script>
'use strict';
const $=id=>document.getElementById(id);
const SEGS=[20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5], NUMS=[20,19,18,17,16,15,25];
const ANCHORS=[[1,80.38],[5,29.53],[10,18.35],[15,13.46],[20,10.36],[25,7.56],[26,7.09],[30,4.3]];
const canvas=$('board'),ctx=canvas.getContext('2d'),S=600,K=1.42;
let g=null,aimMark=null,impact=null;
function sigma(rt){for(let i=1;i<ANCHORS.length;i++){if(rt<=ANCHORS[i][0]){let [a,x]=ANCHORS[i-1],[b,y]=ANCHORS[i];return Math.exp(Math.log(x)+(Math.log(y)-Math.log(x))*(rt-a)/(b-a));}}return 4.3;}
function pos(n,r){let a=SEGS.indexOf(n)*Math.PI/10;return [r*Math.sin(a),-r*Math.cos(a)];}
function ring(r1,r2,a,b,color){ctx.beginPath();ctx.arc(0,0,r2,a,b);ctx.arc(0,0,r1,b,a,true);ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='#67747b';ctx.lineWidth=.45;ctx.stroke();}
function draw(){ctx.clearRect(0,0,S,S);ctx.save();ctx.translate(300,300);ctx.scale(K,K);
ctx.fillStyle='#05090c';ctx.beginPath();ctx.arc(0,0,201,0,Math.PI*2);ctx.fill();
for(let i=0;i<20;i++){let a=-Math.PI/2+(i-.5)*Math.PI/10,b=a+Math.PI/10;for(let [r1,r2,j] of [[15.9,99,0],[99,107,1],[107,162,0],[162,170,1]]){ring(r1,r2,a,b,j?(i%2?'#c84648':'#27855d'):(i%2?'#e9dfc7':'#232b2e'));}let [x,y]=pos(SEGS[i],185);ctx.fillStyle='white';ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(SEGS[i],x,y);}
for(let [r,c] of [[15.9,'#2b966b'],[6.35,'#cf4747']]){ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fillStyle=c;ctx.fill();}
if(aimMark){ctx.beginPath();ctx.arc(aimMark[0],aimMark[1],5,0,Math.PI*2);ctx.fillStyle='#ffca43';ctx.fill();}
if(impact){ctx.beginPath();ctx.arc(impact[0],impact[1],4,0,Math.PI*2);ctx.fillStyle='white';ctx.fill();ctx.strokeStyle='#111';ctx.lineWidth=1;ctx.stroke();}
ctx.restore();}
function hit(x,y){let r=Math.hypot(x,y);if(r>170)return {n:0,m:0,score:0,label:'MISS'};if(r<=15.9){let m=r<=6.35?2:1;return {n:25,m,score:50,label:m===2?'INNER BULL':'OUTER BULL'};}let a=(Math.atan2(y,x)+Math.PI/2+2*Math.PI)%(2*Math.PI);let idx=Math.floor((a+Math.PI/20)/(Math.PI/10))%20;let n=SEGS[idx];let m=(r>=99&&r<=107)?3:(r>=162&&r<=170)?2:1;return {n,m,score:n*m,label:(m===3?'T':m===2?'D':'S')+n};}
function gauss(){return Math.sqrt(-2*Math.log(1-Math.random()))*Math.cos(2*Math.PI*Math.random());}
function makePlayer(){return {score:501,marks:Array(7).fill(0),points:0,darts:0,turnStart:501};}
function log(s){let box=$('log');let d=document.createElement('div');d.textContent=s;box.prepend(d);while(box.children.length>80)box.lastChild.remove();box.scrollTop=0;}
function newLeg(){g.p=[makePlayer(),makePlayer()];g.turn=g.first;g.used=0;g.over=false;aimMark=null;impact=null;log('── レグ '+(g.count+1)+' 開始 ──');draw();update();}
function start(){g={mode:$('mode').value,rt:[+$('me').value,+$('cpu').value],goal:+$('legs').value,first:+$('first').value,wins:[0,0],count:0,turn:0,used:0,over:false,matchOver:false};$('log').replaceChildren();newLeg();}
function finish(i){g.wins[i]++;g.count++;log((i?'NPC':'YOU')+' がレグ獲得！');if(g.wins[i]>=g.goal){g.over=true;g.matchOver=true;log('🏆 '+(i?'NPC':'YOU')+' 勝利！');}else{g.first=1-g.first;newLeg();}}
function nextTurn(){g.turn=1-g.turn;g.used=0;g.p[g.turn].turnStart=g.p[g.turn].score;}
function throwDart(i,x,y){if(!g||g.over||g.turn!==i)return;aimMark=[x,y];let sd=sigma(g.rt[i]);let px=x+sd*gauss(),py=y+sd*gauss(),h=hit(px,py);impact=[px,py];let a=g.p[i],b=g.p[1-i];a.darts++;g.used++;
if(g.mode==='01'){let remain=a.score-h.score;if(remain<0){a.score=a.turnStart;log((i?'NPC':'YOU')+' '+h.label+' → BUST');nextTurn();}else{a.score=remain;log((i?'NPC':'YOU')+' '+h.label+' → 残り'+remain);if(remain===0){finish(i);}else if(g.used===3){nextTurn();}}}
else{let j=NUMS.indexOf(h.n),earned=0;if(j>=0){let before=a.marks[j],add=Math.min(3-before,h.m),excess=h.m-add;a.marks[j]+=add;if(b.marks[j]<3){a.points+=excess*NUMS[j];earned=add+excess;}else{earned=add;}}log((i?'NPC':'YOU')+' '+h.label+' → '+earned+'マーク / '+a.points+'点');if(a.marks.every(v=>v===3)&&a.points>=b.points){finish(i);}else if(g.used===3){nextTurn();}}
draw();update();}
function choose(i){let a=g.p[i],b=g.p[1-i];if(g.mode==='01'){let s=a.score;if(s<=50)return [0,0,'BULL'];if(s<=60&&SEGS.includes(s)){let p=pos(s,65);return [...p,'S'+s];}if(s<=110&&SEGS.includes(s-50)){return [...pos(s-50,65),'S'+(s-50)];}if(s<=180&&(s-50)%3===0&&SEGS.includes((s-50)/3)){return [...pos((s-50)/3,103),'T'+((s-50)/3)];}return [...pos(20,103),'T20'];}
// CR: score the board position after every candidate impact. Targets already closed by
// both players are worthless. A scoring deficit forces scoring before finishing.
const my=a.marks,opp=b.marks,deficit=Math.max(0,b.points-a.points);
const open=NUMS.map((n,j)=>j).filter(j=>my[j]<3||opp[j]<3);
const closable=open.filter(j=>my[j]<3);
const enemyLanes=open.filter(j=>opp[j]===3&&my[j]<3);
const myLanes=open.filter(j=>my[j]===3&&opp[j]<3);
const allClosed=my.every(v=>v===3);
if(allClosed && a.points>=b.points)return [0,0,'BULL']; // normally game already ended
// When trailing with every number closed, scoring is mandatory.
if(allClosed&&deficit>0){let j=myLanes.sort((j,k)=>NUMS[k]-NUMS[j])[0];if(j!==undefined)return j===6?[0,0,'BULL']:[...pos(NUMS[j],103),'T'+NUMS[j]];}
// Candidate targets: every unclosed sector, plus open scoring lanes.
let candidates=[];
for(let j of open){let n=NUMS[j];if(n===25)candidates.push([0,0,'BULL',j]);else candidates.push([...pos(n,103),'T'+n,j]);}
if(!candidates.length)return [0,0,'BULL'];
let best=-Infinity,bestTarget=candidates[0];
for(let target of candidates){
let j=target[3],n=NUMS[j],own=my[j],theirs=opp[j];
let closeNeed=Math.max(0,3-own);
let canScore=theirs<3;
let oppCanScore=theirs===3&&own<3;
let scoreLead=a.points-b.points;
let opponentThreat=oppCanScore?(n/20)*1.5:0;
let ownScoreLane=own===3&&canScore;
// Prioritize high-value closure, but protect against an opponent's open scoring lane.
// Avoid over-scoring while the opponent has closed numbers you still need.
let value;
if(closeNeed>0){
value=18+(n===25?0:n)*0.48;
value+=opponentThreat*13;
value+=Math.min(theirs,3)*1.7;
value-=closeNeed===3?0:2;
if(scoreLead<0&&canScore)value+=Math.min(20,(-scoreLead)/n*4);
if(scoreLead>=0&&enemyLanes.length===0)value+=4;
}else if(ownScoreLane){
value=12+(n===25?0:n)*0.42;
if(scoreLead<0)value+=25+Math.min(22,(-scoreLead)/n*5);
else if(scoreLead<n*2)value+=10;
else value-=25+Math.min(25,scoreLead/n*3);
}
// Closing a number already closed by opponent matters defensively;
// scoring on a number already closed by opponent is impossible.
if(!canScore&&closeNeed===0)value=-Infinity;
if(closeNeed>0&&oppCanScore&&scoreLead<0)value+=8;
if(closeNeed>0&&n===25&&closable.some(k=>k!==6&&NUMS[k]>15))value-=6;
// A lead means close the remaining sectors, not farm unnecessary points.
if(scoreLead>=0&&closeNeed>0)value+=8;
if(value>best){best=value;bestTarget=target;}
}
return bestTarget.slice(0,3);}

function update(){if(!g)return;for(let i=0;i<2;i++){$('p'+i).classList.toggle('active',g.turn===i&&!g.over);$('r'+i).textContent='Rt'+g.rt[i];$('s'+i).textContent=g.mode==='01'?g.p[i].score:g.p[i].points+'pt';$('w'+i).textContent=g.wins[i]+' LEG / '+g.p[i].darts+' darts';}
$('crgrid').style.display=g.mode==='cr'?'grid':'none';if(g.mode==='cr'){let el=$('crgrid');el.replaceChildren();for(let h of ['YOU','NUMBER','NPC']){let d=document.createElement('div');d.textContent=h;el.append(d);}for(let j=0;j<7;j++){for(let t of [0,1,2]){let d=document.createElement('div');d.textContent=t===1?(NUMS[j]===25?'BULL':NUMS[j]):'●'.repeat(g.p[t===0?0:1].marks[j])||'―';el.append(d);}}}
$('message').textContent=g.matchOver?'試合終了':(g.turn?'NPC':'YOU')+' の '+(g.used+1)+'投目';$('npc').disabled=g.over||g.turn!==1;$('suggest').disabled=g.over||g.turn!==0;let a=choose(g.turn);$('hint').textContent=g.matchOver?'設定を変更して新しい試合を開始できます':('おすすめ：'+a[2]+' ／ '+(g.turn?'NPCを1投進めるを押す':'盤面をタップして投げる'));}
canvas.addEventListener('click',e=>{if(!g||g.over||g.turn!==0)return;let b=canvas.getBoundingClientRect();let x=((e.clientX-b.left)/b.width*600-300)/K,y=((e.clientY-b.top)/b.height*600-300)/K;throwDart(0,x,y);});
$('start').onclick=()=>{start();document.activeElement?.blur?.();};$('npc').onclick=()=>{if(g&&!g.over&&g.turn===1){let a=choose(1);throwDart(1,a[0],a[1]);document.activeElement?.blur?.();}};$('suggest').onclick=()=>{if(g&&!g.over&&g.turn===0){let a=choose(0);aimMark=[a[0],a[1]];draw();document.activeElement?.blur?.();}};
for(let id of ['me','cpu']){for(let rt=1;rt<=30;rt++){let o=document.createElement('option');o.value=rt;o.textContent='Rt '+rt;$(id).append(o);}}$('me').value='15';$('cpu').value='20';draw();
</script></body></html>
